# LOCAL DEVELOPMENT ONLY: a separate Slack app that talks to `npm start` on your computer
# over Socket Mode (no public URL). The real, installable app uses slack-manifest.yml.
# Create it at https://api.slack.com/apps -> Create New App -> From a manifest.
display_information:
  name: Gather (dev)
  description: Find a time that works. Reply in your own words; AI turns it into a plan.
  background_color: "#ffffff"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true              # people can DM Gather
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Gather (dev)
    always_online: true
  slash_commands:
    - command: /gather
      description: Plan a get-together in this channel
      usage_hint: "[event name]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands            # /gather
      - chat:write          # post the event, follow-up questions and the plan
      - channels:join       # join a public channel when /gather is used there
      - channels:history    # read replies in event threads (public channels)
      - groups:history      # read replies in event threads (private channels the bot was invited to)
      - im:history          # read direct messages people send to Gather
      - im:write            # DM people who can't make the top pick, and the organizer
      - users:read          # show people's names and use the organizer's time zone
      - reactions:write     # add a check mark to replies it has understood
      - channels:read       # list channel members, to remind people who haven't replied
      - groups:read         # same, in private channels Gather was invited to
      # Requested ahead of time so these features won't need a reinstall later:
      - mpim:read           # group DMs: see the ones Gather is added to
      - mpim:history        # group DMs: read replies there
      - mpim:write          # group DMs: post there
      - team:read           # workspace name and icon
      - usergroups:read     # remind a user group, e.g. @design-team
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
